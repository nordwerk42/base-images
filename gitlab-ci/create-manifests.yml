##############################################
## Create multi-arch manifests
##############################################

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"

.manifest_base: &manifest_base
  stage: manifest
  image: docker@sha256:24173119fa6d1b5b4a27ab164fa7863deb66574ee5b90fef3b85dc888ef1a7e6
  dependencies: []
  before_script:
    - mkdir -p ~/.docker
    - echo '{"experimental":"enabled"}' > ~/.docker/config.json
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
  only:
    - main

create_manifest:
  <<: [*manifest_base]
  needs:
    - push_multi_arch
  script:
    - docker manifest create $IMAGE_NAME:${VERSION} $IMAGE_NAME:${VERSION}-amd64 $IMAGE_NAME:${VERSION}-arm64
    - docker manifest push $IMAGE_NAME:${VERSION}
    - echo "Multi-arch manifest created at $IMAGE_NAME:${VERSION}"

create_manifest_debug:
  <<: [*manifest_base]
  needs:
    - push_multi_arch_debug
  script:
    - docker manifest create $IMAGE_NAME:${VERSION}-debug $IMAGE_NAME:${VERSION}-amd64-debug $IMAGE_NAME:${VERSION}-arm64-debug
    - docker manifest push $IMAGE_NAME:${VERSION}-debug
    - echo "Multi-arch debug manifest created at $IMAGE_NAME:${VERSION}-debug"