##############################################
## Prepare container tars for further OCI scanning
#######################
.common: &common
  - ARCH: [amd64, arm64]
    VERSION: ["latest"]

un_gzip_tars:
  stage: build
  image:
    name: gcr.io/go-containerregistry/crane:debug@sha256:fbdf6d55c5ae90d9ae637b9bd9f10119496fdf18a3b5f9cd3078ae6044161c18
    entrypoint: ["/bin/sh", "-c"]
  needs:
    - job: build_multi_arch
      parallel:
        matrix: *common
  script:
    - gunzip -c build-${ARCH}/base-${VERSION}-${ARCH}.tar.gz > base-${VERSION}-${ARCH}.tar
  parallel:
    matrix: *common
  artifacts:
    paths:
      - base-*.tar
