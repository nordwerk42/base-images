name: promote

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Promote latest without waiting (security fix)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: promote

env:
  MIN_AGE_DAYS: "3"
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  promote:
    name: promote ${{ matrix.target.package }}:${{ matrix.target.from }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { package: base, from: latest, to: "stable 13-minimal-stable", workflow: build, min_deb: "1" }
          - { package: static, from: latest, to: "stable", workflow: runtimes, min_deb: "0" }
          - { package: python, from: "3.13", to: "3.13-stable", workflow: runtimes, min_deb: "1" }
          - { package: python, from: "3.14", to: "3.14-stable stable", workflow: runtimes, min_deb: "1" }
          - { package: nodejs, from: "24", to: "24-stable", workflow: runtimes, min_deb: "1" }
          - { package: nodejs, from: "26", to: "26-stable stable", workflow: runtimes, min_deb: "1" }
    runs-on: ubuntu-24.04
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.package }}
      PACKAGE: ${{ matrix.target.package }}
      FROM_TAG: ${{ matrix.target.from }}
      TO_TAGS: ${{ matrix.target.to }}
      MIN_DEB_PACKAGES: ${{ matrix.target.min_deb }}
      IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/${{ matrix.target.workflow }}\.yml@refs/heads/main$
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOW: ${{ inputs.now }}
        run: |
          digest_of() { docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -r .digest; }
          first_to=${TO_TAGS%% *}
          latest=$(digest_of "${REGISTRY_IMAGE}:${FROM_TAG}" 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "${REGISTRY_IMAGE}:${FROM_TAG} does not exist yet" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          stable=$(digest_of "${REGISTRY_IMAGE}:${first_to}" 2>/dev/null || true)
          echo "${FROM_TAG} $latest, ${first_to} ${stable:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$latest" = "$stable" ]; then
            echo "${first_to} is already ${FROM_TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          created=$(gh api --paginate "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/versions" \
            --jq ".[] | select(.name == \"$latest\") | .created_at")
          age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
          echo "${FROM_TAG} published $created, $age days ago" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$NOW" != "true" ] && [ "$age" -lt "$MIN_AGE_DAYS" ]; then
            echo "younger than $MIN_AGE_DAYS days, not promoted" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "candidate=$latest" >> "$GITHUB_ENV"

      - name: Verify signature and fetch SBOMs
        if: env.candidate != ''
        run: |
          cosign verify "${REGISTRY_IMAGE}@${candidate}" \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          mkdir -p sbom
          for arch in amd64 arm64; do
            d=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${REGISTRY_IMAGE}@${candidate}" \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest')
            cosign verify-attestation --type cyclonedx "${REGISTRY_IMAGE}@${d}" \
              --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
              | head -n1 | jq -r .payload | base64 -d | jq .predicate > "sbom/$arch.cdx.json"
          done

      - name: Install scanners
        if: env.candidate != ''
        run: scripts/ci/install-scanners.sh

      - name: Scan SBOMs with today's databases
        if: env.candidate != ''
        run: |
          for arch in amd64 arm64; do
            scripts/ci/scan-sbom.sh "sbom/$arch.cdx.json" "report/$arch"
          done

      - name: Move stable
        if: env.candidate != ''
        run: |
          args=()
          for t in $TO_TAGS; do args+=(--tag "${REGISTRY_IMAGE}:${t}"); done
          docker buildx imagetools create "${args[@]}" "${REGISTRY_IMAGE}@${candidate}"
          echo "${TO_TAGS} -> ${REGISTRY_IMAGE}@${candidate}" | tee -a "$GITHUB_STEP_SUMMARY"
