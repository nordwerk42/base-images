.common: &common
  devguard_asset_name: "@opencode/projects/oci/assets/base"
  devguard_token: "$DEVGUARD_TOKEN"
  devguard_api_url: "https://api.devguard.opencode.de"
  

include:
##############################################
## Build Node.js multi-arch images
#######################
- component: $CI_SERVER_FQDN/open-code/oci/container-hardening-work-bench/build-nix-multi-arch@main
  inputs:
    <<: *common
    package_name: base-${VERSION}-${ARCH}
    job_suffix: ""
    architectures:
      - amd64
      - arm64
    versions:
      - latest


##############################################
## Build Node.js multi-arch DEBUG images
#######################
- component: $CI_SERVER_FQDN/open-code/oci/container-hardening-work-bench/build-nix-multi-arch@main
  inputs:
    <<: *common
    package_name: base-${VERSION}-${ARCH}-debug
    job_suffix: "_debug"
    architectures:
      - amd64
      - arm64
    versions:
      - latest