.common: &common
  architectures:
    - arm64
    - amd64

include:
  - component: $CI_SERVER_FQDN/open-code/oci/container-hardening-work-bench/push-images-multi-arch@main
    inputs:
      <<: *common
      package_name: base-latest-${ARCH}
      job_suffix: ""
      image_tags:
        - { ARCHITECTURE: "amd64", IMAGE_TAG: "$IMAGE_TAG_AMD64" }
        - { ARCHITECTURE: "arm64", IMAGE_TAG: "$IMAGE_TAG_ARM64" }
      dependencies:
        - build_multi_arch
      needs:
        - build_multi_arch
      run_only_on:
        - main
        - modernize-pipeline
  - component: $CI_SERVER_FQDN/open-code/oci/container-hardening-work-bench/push-images-multi-arch@main
    inputs:
      <<: *common
      package_name: base-latest-${ARCH}-debug
      job_suffix: "_debug"
      images:
        - "$IMAGE_TAG_ARM64_DEBUG"
        - "$IMAGE_TAG_AMD64_DEBUG"
      dependencies:
        - build_multi_arch_debug
      needs:
        - build_multi_arch_debug
      run_only_on:
        - main
        - modernize-pipeline
