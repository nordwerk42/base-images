###### SUMMARY
# 1. Secret Scanning & Badge Generation
# 2. Build Node.js multi-arch images
# 3. Build Node.js multi-arch DEBUG images
# 4. Upload SBOMs to DevGuard
# 5. Unpack container tars for scanning
# 6. OCI Image Scanning (tars)
# 7. Push images to GitLab Container Registry
# 8. Create multi-arch manifests
# 9. Sign images and manifests with DevGuard
# 10. Attest images and manifests with DevGuard
###### SUMMARY
stages:
  - .pre
  - build
  - test
  - oci-image
  - attestation
  - smoke-test

.common: &common
  devguard_asset_name: "@opencode/projects/zendis-3/assets/base"
  devguard_token: "$DEVGUARD_TOKEN"
  devguard_api_url: "https://api.devguard.opencode.de"

include:
  ##############################################
  ## Secret Scanning
  #######################
  - component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/secret-scanning@main
    inputs:
      <<: *common
      devguard_web_ui: "https://devguard.opencode.de"

  - component: $CI_SERVER_FQDN/oci-community/tools/container-hardening-work-bench/full-nix@main
    inputs:
      package_name: "base"
      image_variant: "minimal"
      <<: *common
      architectures: ["amd64", "arm64"]
      versions: ["0"]

  - component: $CI_SERVER_FQDN/oci-community/tools/container-hardening-work-bench/full-nix@main
    inputs:
      package_name: "base-debug"
      <<: *common
      architectures: ["amd64", "arm64"]
      versions: ["0"]

##############################################
## Smoke test top-level packages
#######################
test_toplevel_packages_amd64:
  stage: smoke-test
  image:
    name: $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_SLUG}-amd64
    pull_policy: always
    entrypoint: [""]
  script:
    - sh test/test_toplevel_packages.sh
  only:
    - main

test_toplevel_packages_arm64:
  stage: smoke-test
  tags:
    - arm
  image:
    name: $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_SLUG}-arm64
    pull_policy: always
    entrypoint: [""]
  script:
    - sh test/test_toplevel_packages.sh
  only:
    - main
