name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/base
  DEBIAN_RELEASE: "13"

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build image, debug image and SBOM
        run: |
          nix build --print-build-logs --out-link image ".#base-0-${{ matrix.arch }}"
          nix build --print-build-logs --out-link debug ".#base-debug-0-${{ matrix.arch }}"
          nix build --print-build-logs --out-link sbom ".#base-0-${{ matrix.arch }}-sbom"
          mkdir -p out
          cp -L image out/image.tar.gz
          if [ -d sbom ]; then src=$(ls sbom/*.json); else src=sbom; fi
          jq -e '.bomFormat == "CycloneDX"' "$src" >/dev/null
          # Scanners need the distribution as an operating-system component to match Debian advisories.
          jq --arg v "$DEBIAN_RELEASE" '
            if any(.components[]?; .type == "operating-system") then .
            else .components += [{"type":"operating-system","name":"debian","version":$v,"bom-ref":"os-debian"}] end
          ' "$src" > out/sbom.cdx.json
          grep -ohE 'snapshot\.debian\.org/archive/debian(-security)?/[0-9]{8}T[0-9]{6}Z' "config.${{ matrix.arch }}.json" \
            | grep -oE '[0-9]{8}T[0-9]{6}Z' | sort -u | tail -1 > out/snapshot
          echo "Debian snapshot: $(cat out/snapshot)"
          jq -r '.components[] | "\(.name) \(.version)"' out/sbom.cdx.json | sort

      - name: Smoke test
        run: |
          docker load --quiet < out/image.tar.gz
          docker load --quiet < debug
          docker run --rm --entrypoint /bin/sh -v "$PWD/test:/t:ro" "base:${{ matrix.arch }}-debug" /t/test_toplevel_packages.sh
          if docker run --rm --entrypoint /bin/sh "base:${{ matrix.arch }}" -c true 2>/dev/null; then
            echo "minimal image contains a shell" >&2
            exit 1
          fi
          user=$(docker image inspect --format '{{.Config.User}}' "base:${{ matrix.arch }}")
          echo "User: $user"
          [ "$user" != "" ] && [ "$user" != "0" ] && [ "$user" != "root" ]

      - name: Install scanners
        run: scripts/ci/install-scanners.sh

      - name: Scan SBOM
        run: scripts/ci/scan-sbom.sh out/sbom.cdx.json out/scan

      - name: Scan summary
        if: always()
        run: |
          if [ -f out/scan/summary.md ]; then
            { echo "### ${{ matrix.arch }}"; cat out/scan/summary.md; echo; echo '```'; cat out/scan/grype.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: base-${{ matrix.arch }}
          path: out/
          retention-days: 14

  publish:
    name: publish (${{ matrix.arch }})
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-${{ matrix.arch }}
          path: out

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          SHA: ${{ github.sha }}
        run: |
          docker load --quiet < out/image.tar.gz
          ref="${REGISTRY_IMAGE}:sha-${SHA::7}-${{ matrix.arch }}"
          docker tag "base:${{ matrix.arch }}" "$ref"
          docker push --quiet "$ref"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_ENV"
          echo "$ref@$digest"

      - name: Sign and attach SBOM
        run: |
          cosign sign --yes "${REGISTRY_IMAGE}@${digest}"
          cosign attest --yes --type cyclonedx --predicate out/sbom.cdx.json "${REGISTRY_IMAGE}@${digest}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ env.digest }}
          push-to-registry: true

  manifest:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-amd64
          path: out

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          SHA: ${{ github.sha }}
        run: |
          SNAPSHOT=$(cat out/snapshot)
          digest_of() { docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -r .digest; }
          AMD64=$(digest_of "${REGISTRY_IMAGE}:sha-${SHA::7}-amd64")
          ARM64=$(digest_of "${REGISTRY_IMAGE}:sha-${SHA::7}-arm64")
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${DEBIAN_RELEASE}-minimal" \
            --tag "${REGISTRY_IMAGE}:latest" \
            --tag "${REGISTRY_IMAGE}:${DEBIAN_RELEASE}-minimal-${SNAPSHOT}" \
            --tag "${REGISTRY_IMAGE}:sha-${SHA::7}" \
            "${REGISTRY_IMAGE}@${AMD64}" "${REGISTRY_IMAGE}@${ARM64}"
          digest=$(digest_of "${REGISTRY_IMAGE}:sha-${SHA::7}")
          echo "digest=$digest" >> "$GITHUB_ENV"
          echo "${REGISTRY_IMAGE}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sign manifest
        run: cosign sign --yes "${REGISTRY_IMAGE}@${digest}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ env.digest }}
          push-to-registry: true
