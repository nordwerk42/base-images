###### SUMMARY
# 1. Secret Scanning & Badge Generation
# 2. Build Node.js multi-arch images
# 3. Build Node.js multi-arch DEBUG images
# 4. Upload SBOMs to DevGuard
# 5. Unpack container tars for scanning
# 6. OCI Image Scanning (tars)
# 7. Push images to GitLab Container Registry
# 8. Create multi-arch manifests
# 9. Sign images and manifests with DevGuard
# 10. Attest images and manifests with DevGuard
###### SUMMARY
stages:
  - .pre
  - build
  - test
  - oci-image
  - attestation

.common: &common
  devguard_asset_name: "@opencode/projects/oci/assets/base"
  devguard_token: "$DEVGUARD_TOKEN"
  devguard_api_url: "https://api.devguard.opencode.de"

.matrix: &matrix
  - ARCHITECTURE: amd64
    VERSION: latest
  - ARCHITECTURE: arm64
    VERSION: latest

include:
  ##############################################
  ## Secret Scanning
  #######################
  - component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/secret-scanning@main
    inputs:
      <<: *common
      devguard_web_ui: "https://devguard.opencode.de"

  ##############################################
  ## Generates Badge Programm Report for the image to later attest it
  #######################
  - component: $CI_SERVER_FQDN/open-code/badgebackend/badge-api/badges@b321cb16eb8e49c80eae0b33907abaf1d6e99f0c
  ##############################################
  - component: $CI_SERVER_FQDN/open-code/oci/container-hardening-work-bench/collect-child-pipeline-artifacts@add-generate-tag-cli-command
    inputs:
      needs:
        - "build_image"
      dependencies:
        - "build_image"

  - component: $CI_SERVER_FQDN/open-code/oci/container-hardening-work-bench/create-manifest-multi-arch@add-generate-tag-cli-command
    inputs:
      needs:
        - collect_child_pipeline_artifacts
      dependencies:
        - collect_child_pipeline_artifacts

build_image:
  stage: build
  parallel:
    matrix: *matrix
  trigger:
    strategy: depend
    include:
      - component: $CI_SERVER_FQDN/open-code/oci/container-hardening-work-bench/build-nix@add-generate-tag-cli-command
        inputs:
          <<: *common
          package_name: base
          architecture: ${ARCHITECTURE}
          version: ${VERSION}
          output_path_sbom: "sbom.json"
          output_path_image: "image.tar"
      
      - remote: https://gitlab.com/l3montree/devguard/-/raw/add-generate-tag-component/templates/container-scanning-and-attest.yml
        inputs:
          <<: *common
          build_job_name: "build_nix"
          version: add-generate-tag-component
          build_stage: build
          attest_stage: test
          architecture: ${ARCHITECTURE}
          devguard_origin: OCI_IMAGE_SCAN

      - remote: https://gitlab.com/l3montree/devguard/-/raw/add-generate-tag-component/templates/sbom-upload.yml
        inputs:
          <<: *common
          stage: "test"
          sbom_file: "sbom.json"
          needs:
            - "build_nix"
            - "devguard:generate_tag"
          dependencies:
            - "build_nix"
            - "devguard:generate_tag"
          devguard_artifact_name: $ARTIFACT_NAME
          devguard_origin: SBOM_UPLOAD

