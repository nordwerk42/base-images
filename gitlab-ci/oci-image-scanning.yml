.common: &common
  devguard_asset_name: "@opencode/projects/oci/assets/base"
  devguard_token: "$DEVGUARD_TOKEN"
  devguard_api_url: "https://api.devguard.opencode.de"
  devguard_web_ui: "https://devguard.opencode.de"
  ignore_external_references: "true"
  stage: "test"
  fail_on_cvss: "high"

include:
##############################################
## OCI Image Scanning
#######################
- component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/container-scanning@main
  inputs:
    <<: *common
    devguard_origin: "CONTAINER_SCANNING_3.11_AMD64"
    devguard_artifact_name: "pkg:oci/base?repository_url=$CI_REGISTRY_IMAGE&tag=latest-amd64&arch=amd64"
    job_suffix: "_amd64"
    image_tar_path: "base-latest-amd64.tar"
    needs:
      - "un_gzip_tars: [amd64, latest]"
    dependencies:
      - "un_gzip_tars: [amd64, latest]"
- component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/container-scanning@main
  inputs:
    <<: *common
    devguard_origin: "CONTAINER_SCANNING_3.11_ARM64"
    devguard_artifact_name: "pkg:oci/base?repository_url=$CI_REGISTRY_IMAGE&tag=latest-arm64&arch=arm64"
    job_suffix: "_arm64"
    image_tar_path: "base-latest-arm64.tar"
    needs:
      - "un_gzip_tars: [arm64, latest]"
    dependencies:
      - "un_gzip_tars: [arm64, latest]"