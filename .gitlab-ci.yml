###### SUMMARY
# 1. Secret Scanning & Badge Generation
# 2. Build Python multi-arch images
# 3. Build Python multi-arch DEBUG images
# 4. Test DEBUG images (python3 smoke test)
# 5. Upload SBOMs to DevGuard
# 6. Unpack container tars for scanning
# 7. OCI Image Scanning (tars)
# 8. Push images to GitLab Container Registry
# 9. Create multi-arch manifests
# 10. Sign images and manifests with DevGuard
# 11. Attest images and manifests with DevGuard
###### SUMMARY
stages:
  - .pre
  - build
  - test
  - oci-image
  - smoke-test
  - attestation

.common: &common
  devguard_asset_name: "@opencode/projects/zendis-3/assets/python3"
  devguard_token: "$DEVGUARD_TOKEN"
  devguard_api_url: "https://api.devguard.opencode.de"

include:
  ##############################################
  ## Secret Scanning
  #######################
  - component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/secret-scanning@main
    inputs:
      <<: *common
      devguard_web_ui: "https://devguard.opencode.de"

  ##############################################
  ## Build Python multi-arch minimal images
  #######################
  - component: $CI_SERVER_FQDN/oci-community/tools/container-hardening-work-bench/full-nix@main
    inputs:
      package_name: "python3"
      image_variant: "minimal"
      <<: *common
      architectures: ["amd64", "arm64"]
      versions: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  ##############################################
  ## Build Python multi-arch DEBUG images
  #######################
  - component: $CI_SERVER_FQDN/oci-community/tools/container-hardening-work-bench/full-nix@main
    inputs:
      package_name: "python3-debug"
      <<: *common
      architectures: ["amd64", "arm64"]
      versions: ["3.10", "3.11", "3.12", "3.13", "3.14"]

##############################################
## Test DEBUG images
#######################
test_debug_image:
  stage: smoke-test
  parallel:
    matrix:
      - VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  image:
    name: $CI_REGISTRY_IMAGE:${VERSION}-${CI_COMMIT_REF_SLUG}-amd64
    pull_policy: always
  script:
    - python3 test/test.py
  only:
    - main
