###### SUMMARY
# 1. Secret Scanning & Badge Generation
# 2. Build Node.js multi-arch images
# 3. Build Node.js multi-arch DEBUG images
# 4. Upload SBOMs to DevGuard
# 5. Unpack container tars for scanning
# 6. OCI Image Scanning (tars)
# 7. Push images to GitLab Container Registry
# 8. Create multi-arch manifests
# 9. Sign images and manifests with DevGuard
# 10. Attest images and manifests with DevGuard
###### SUMMARY
stages:
  - pre
  - build
  - test
  - push
  - manifest
  - sign
  - attestation
 
include:
##############################################
## Secret Scanning
#######################
- component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/secret-scanning@main
  inputs:
    devguard_asset_name: "@opencode/projects/oci/assets/base"
    devguard_token: "$DEVGUARD_TOKEN"
    devguard_api_url: "https://api.devguard.opencode.de"
    devguard_web_ui: "https://devguard.opencode.de"


##############################################
## Generates Badge Programm Report for the image to later attest it
#######################
- component: $CI_SERVER_FQDN/open-code/badgebackend/badge-api/badges@b321cb16eb8e49c80eae0b33907abaf1d6e99f0c


##############################################
## Build Node.js multi-arch images
#######################
- local: 'gitlab-ci/build-images.yml'


##############################################
## Upload SBOMs to DevGuard
#######################
- local: 'gitlab-ci/sbom-upload.yml'


##############################################
## OCI Image Scanning
#######################
- local: 'gitlab-ci/oci-image-scanning.yml'


##############################################
## Push images to GitLab Container Registry
#######################
- local: 'gitlab-ci/push-images.yml'


##############################################
## Attest images and manifests
#######################
- local: 'gitlab-ci/attest-images.yml'


##############################################
## Prepare container tars for further oci scanning
#######################
- local: 'gitlab-ci/unpack-images.yml'


##############################################
## Create multi-arch manifests
#######################
- local: 'gitlab-ci/create-manifests.yml'


##############################################
## Sign images and manifests with DevGuard
#######################
- local: 'gitlab-ci/sign-images.yml'