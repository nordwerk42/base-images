.common: &common
  devguard_asset_name: "@opencode/projects/oci/assets/base"
  devguard_token: "$DEVGUARD_TOKEN"
  devguard_api_url: "https://api.devguard.opencode.de"
  devguard_web_ui: "https://devguard.opencode.de"
  ignore_external_references: "true"

include:
- component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/sbom-upload@main
  inputs:
    <<: *common
    devguard_origin: "SBOM_UPLOAD_LATEST_AMD64"
    devguard_artifact_name: "pkg:oci/base?repository_url=$CI_REGISTRY_IMAGE&tag=latest-amd64&arch=amd64"
    job_suffix: "_amd64"
    needs: ["build_multi_arch: [amd64, latest]"]
    dependencies: ["build_multi_arch: [amd64, latest]"]
    sbom_file: "build-amd64/base-latest-amd64-sbom.json"
- component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/sbom-upload@main
  inputs:
    <<: *common
    devguard_origin: "SBOM_UPLOAD_LATEST_ARM64"
    devguard_artifact_name: "pkg:oci/base?repository_url=$CI_REGISTRY_IMAGE&tag=latest-arm64&arch=arm64"
    job_suffix: "_arm64"
    needs: ["build_multi_arch: [arm64, latest]"]
    dependencies: ["build_multi_arch: [arm64, latest]"]
    sbom_file: "build-arm64/base-latest-arm64-sbom.json"
- component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/sbom-upload@main
  inputs:
    <<: *common
    devguard_origin: "SBOM_UPLOAD_LATEST_AMD64_DEBUG"
    devguard_artifact_name: "pkg:oci/base?repository_url=$CI_REGISTRY_IMAGE&tag=latest-amd64-debug&arch=amd64"
    job_suffix: "_amd64"
    needs: ["build_multi_arch_debug: [amd64, latest]"]
    dependencies: ["build_multi_arch_debug: [amd64, latest]"]
    sbom_file: "build-amd64/base-latest-amd64-debug-sbom.json"
- component: $CI_SERVER_FQDN/l3montree/devguard-ci-components/sbom-upload@main
  inputs:
    <<: *common
    devguard_origin: "SBOM_UPLOAD_LATEST_ARM64_DEBUG"
    devguard_artifact_name: "pkg:oci/base?repository_url=$CI_REGISTRY_IMAGE&tag=latest-arm64-debug&arch=arm64"
    job_suffix: "_arm64"
    needs: ["build_multi_arch_debug: [arm64, latest]"]
    dependencies: ["build_multi_arch_debug: [arm64, latest]"]
    sbom_file: "build-arm64/base-latest-arm64-debug-sbom.json"