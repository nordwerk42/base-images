.common: &common
  stage: sign
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main-latest
    entrypoint: [""]
  dependencies: []
  before_script:
    - devguard-scanner login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  only:
    - main

##############################################
## Sign images and manifests with DevGuard
#######################
sign_detailed_images:
  <<: *common
  needs:
    - push_multi_arch
    - push_multi_arch_debug
  script:
    - devguard-scanner sign --token="$DEVGUARD_TOKEN" --assetName="@opencode/projects/oci/assets/base" --apiUrl="https://api.devguard.opencode.de" $IMAGE_NAME:$VERSION-$ARCH$SUFFIX
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
        SUFFIX: ["", "-debug"]
        VERSION: ["latest"]

sign_manifest:
  <<: *common
  needs: [create_manifest]
  script:
    - devguard-scanner sign --token="$DEVGUARD_TOKEN" $IMAGE_NAME:${VERSION} --assetName="@opencode/projects/oci/assets/base" --apiUrl="https://api.devguard.opencode.de"

sign_manifest_debug:
  <<: *common
  needs: [create_manifest]
  script:
    - devguard-scanner sign --token="$DEVGUARD_TOKEN" $IMAGE_NAME:${VERSION}-debug --assetName="@opencode/projects/oci/assets/base" --apiUrl="https://api.devguard.opencode.de"
